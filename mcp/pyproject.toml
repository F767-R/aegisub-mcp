[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aegisub-mcp"
version = "0.3.1"
description = "Local MCP server for the Aegisub MCP fork"
requires-python = ">=3.11"
dependencies = ["mcp>=1.26,<2", "pywin32>=311; sys_platform == 'win32'"]
license = "BSD-3-Clause"

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.24"]

[project.scripts]
aegisub-mcp = "aegisub_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
