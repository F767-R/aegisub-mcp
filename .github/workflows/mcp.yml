name: MCP integration
on:
  push:
    branches: [mcp-support]
  pull_request:
    paths: ['mcp/**', 'tools/mcp-*', 'src/mcp_bridge.*', 'src/frame_main.*', '.github/workflows/mcp.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  python:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install ./mcp[test]
      - run: python -m pytest mcp/tests -v
  native-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build build-essential pkg-config intltool gettext libfontconfig1-dev libass-dev libasound2-dev libffms2-dev libboost-all-dev libhunspell-dev libcurl4-openssl-dev libuchardet-dev libgtest-dev libgmock-dev libwxgtk3.2-dev libportal-gtk3-dev xvfb
          python -m pip install meson ./mcp[test]
      - run: meson setup build -Dbuildtype=debugoptimized -Db_pch=false -Dtests=false
      - run: meson compile -C build -j 2
      - name: Real GUI integration
        run: |
          mkdir -p ~/.aegisub
          echo '{"App":{"Language":"en_US","First Start":false,"Auto":{"Check For Updates":false,"Save":false,"Load Linked Files":1}}}' > ~/.aegisub/config.json
          xvfb-run -a python -m pytest mcp/tests/test_native.py -v
        env:
          AEGISUB_MCP_TEST_EXE: ${{ github.workspace }}/build/aegisub
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-linux-logs
          path: build/meson-logs/
