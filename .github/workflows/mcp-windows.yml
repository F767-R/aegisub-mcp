name: MCP Windows release

on:
  push:
    branches: [mcp-support]
    paths: ['src/**', 'libaegisub/**', 'mcp/**', 'meson.build', 'meson_options.txt', 'subprojects/**', 'tools/mcp-*', '.github/workflows/mcp-windows.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      AEGISUB_BUILD_BRANCH: mcp-support
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build tools
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -m pip install meson setuptools ./mcp[test]
          if ($LASTEXITCODE) { throw 'Python dependency installation failed' }
          choco install ninja innosetup -y --no-progress
          if ($LASTEXITCODE) { throw 'Build tool installation failed' }
          gh release download --repo mlocati/gettext-iconv-windows --pattern 'gettext*-static-64.zip' --output gettext.zip
          if ($LASTEXITCODE) { throw 'gettext download failed' }
          Expand-Archive gettext.zip -DestinationPath gettext
          "$PWD\gettext\bin" >> $env:GITHUB_PATH
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (!$vsPath) { throw 'Visual Studio not found' }
          "VS=$vsPath" >> $env:GITHUB_ENV
      - name: Configure and compile Windows x64
        run: |
          Import-Module "$env:VS\Common7\Tools\Microsoft.VisualStudio.DevShell.dll"
          Enter-VsDevShell -VsInstallPath $env:VS -SkipAutomaticLocation -DevCmdArguments '-arch=x64 -host_arch=x64'
          meson setup build -Dbuildtype=release -Ddefault_library=static --force-fallback-for=zlib,harfbuzz,freetype2,fribidi -Dfallback_nasm=true -Dfreetype2:harfbuzz=disabled -Dharfbuzz:freetype=disabled -Dharfbuzz:cairo=disabled -Dharfbuzz:glib=disabled -Dharfbuzz:gobject=disabled -Dharfbuzz:tests=disabled -Dharfbuzz:docs=disabled -Dfribidi:tests=false -Dfribidi:docs=false -Dlibass:fontconfig=disabled
          if ($LASTEXITCODE) { throw 'Meson configuration failed' }
          meson compile -C build
          if ($LASTEXITCODE) { throw 'Windows compilation failed' }
          meson test -C build --verbose --suite Aegisub
          if ($LASTEXITCODE) { throw 'Native unit tests failed' }
      - name: Package installer and portable application
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          Import-Module "$env:VS\Common7\Tools\Microsoft.VisualStudio.DevShell.dll"
          Enter-VsDevShell -VsInstallPath $env:VS -SkipAutomaticLocation -DevCmdArguments '-arch=x64 -host_arch=x64'
          # Packaging scripts replace only these build-owned directories.
          $buildRoot = (Resolve-Path build).Path
          if ($buildRoot -ne (Join-Path $env:GITHUB_WORKSPACE 'build')) { throw 'Unexpected build path' }
          meson compile win-installer -C build
          if ($LASTEXITCODE) { throw 'Installer packaging failed' }
          meson compile win-portable -C build
          if ($LASTEXITCODE) { throw 'Portable packaging failed' }
      - name: Test real packaged Windows GUI and MCP
        run: |
          $portable = Join-Path $PWD 'build/aegisub-portable'
          $config = Join-Path $portable 'config.json'
          $original = [IO.File]::ReadAllText($config)
          try {
            '{"App":{"Local Config":true,"Language":"en_US","First Start":false,"Auto":{"Check For Updates":false,"Save":false}}}' | Set-Content $config -Encoding utf8
            $env:AEGISUB_MCP_TEST_EXE = Join-Path $portable 'aegisub.exe'
            python -m pytest mcp/tests -v
            if ($LASTEXITCODE) { throw 'Packaged Windows MCP tests failed' }
          } finally {
            [IO.File]::WriteAllText($config, $original)
          }
      - name: Prepare release assets
        run: tools/mcp-package-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: aegisub-mcp-windows-x64
          path: build/mcp-release/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-build-logs
          path: build/meson-logs/

  publish:
    needs: build
    if: github.repository == 'F767-R/aegisub-mcp' && github.ref == 'refs/heads/mcp-support'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: aegisub-mcp-windows-x64
          path: release
      - name: Publish tested Windows prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BUILD_SHA: ${{ github.sha }}
        run: |
          tag="mcp-windows-${BUILD_SHA:0:12}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "This commit already has a release; preserving its assets."
          else
            gh release create "$tag" release/* --target "$BUILD_SHA" --prerelease --title "Aegisub MCP Windows x64 (${BUILD_SHA:0:7})" --notes "Windows x64 installer and portable package with the native MCP bridge. The portable package includes the Python MCP server and setup-mcp.cmd (Python 3.11+ required). See MCP-README.md in the package for setup. Native unit tests and all 28 MCP tests passed against the packaged Windows application. Unsigned community prerelease. SHA256SUMS.txt covers the downloadable assets."
          fi
